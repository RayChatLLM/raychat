name: Release CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_diagnostic:
        description: Diagnose full Windows discovery using the previous direct launch path
        type: boolean
        default: false
      diagnostic_tests:
        description: Space-separated unittest names for an isolated diagnostic
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    name: Release / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_diagnostic && '[{"os":"windows-latest","name":"Windows + Defender","artifact":"windows"}]' || '[{"os":"ubuntu-latest","name":"Linux","artifact":"linux"},{"os":"macos-latest","name":"macOS","artifact":"macos"},{"os":"windows-latest","name":"Windows + Defender","artifact":"windows"}]') }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      RAYCHAT_DIAGNOSTIC_TESTS: ${{ inputs.diagnostic_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-windows-test.txt
      - name: Install development checkers
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-dev.txt
      - name: Static quality and negative type contracts, once
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python tools/verify_quality.py ci-output/quality
          python tools/check_types.py --contracts-only
      - name: Install CI-only console driver
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows-test.txt
      - name: Unit suite and extracted user release
        if: runner.os != 'Windows'
        run: python -B -m tools.ci_release --output ci-output
      - name: Unit suite and real release console as a standard user with Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/verify_windows_filesystem.ps1 -Python (Get-Command python).Source -Diagnostic:('${{ inputs.windows_diagnostic }}' -eq 'true')
      - name: Retain tested archive, checksums, timings and terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ci-output/
          if-no-files-found: error
