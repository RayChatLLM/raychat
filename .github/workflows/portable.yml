name: Release CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    name: Release / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: linux
          - os: macos-latest
            name: macOS
            artifact: macos
          - os: windows-latest
            name: Windows + Defender
            artifact: windows
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-windows-test.txt
      - name: Install development checkers
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-dev.txt
      - name: Static quality and negative type contracts, once
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python tools/verify_quality.py ci-output/quality
          python tools/check_types.py --contracts-only
      - name: Install CI-only console and test drivers
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows-test.txt
      - name: Unit suite and extracted user release
        if: runner.os != 'Windows'
        run: python -B -m tools.ci_release --output ci-output
      - name: Start supervised Windows acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor start
      - name: Wait for Windows checkpoint 1
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain Windows checkpoint 1 before further testing
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-checkpoint-1-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Wait for Windows checkpoint 2
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 180
      - name: Retain Windows checkpoint 2 before further testing
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-checkpoint-2-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Wait for Windows checkpoint 3
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 180
      - name: Retain Windows checkpoint 3 before further testing
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-checkpoint-3-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Wait for Windows checkpoint 4
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 180
      - name: Retain Windows checkpoint 4 before further testing
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-checkpoint-4-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Wait for Windows checkpoint 5
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 180
      - name: Retain Windows checkpoint 5 before further testing
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-checkpoint-5-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Wait for Windows checkpoint 6
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 180
      - name: Retain Windows checkpoint 6 before further testing
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-checkpoint-6-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Require completed Windows acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 7
        run: python -B -S -m tools.windows_ci_supervisor finish
      - name: Retain tested archive, checksums, timings and terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ci-output/
          if-no-files-found: error
