name: Portable standard-library build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Complete unit suite, strict typing and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development-only checkers
        run: python -m pip install -r requirements-dev.txt

      - name: Verify development dependency compatibility
        run: python -m pip check

      - name: Check all sources with the approved lint policy
        run: python tools/verify_quality.py build/quality

      - name: Check every source with strict mypy
        run: python tools/check_types.py

      - name: Check Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run the complete standard-library test suite
        shell: bash
        run: |
          set -o pipefail
          python -B -S -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/raychat-tests.log"

      - name: Publish static failure diagnostics
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          paths = [*Path("build/quality").glob("*.txt"), Path(os.environ["RUNNER_TEMP"]) / "raychat-tests.log"]
          for path in paths:
              if path.is_file():
                  detail = path.read_text(encoding="utf-8", errors="replace")[-16000:]
                  for offset in range(0, len(detail), 3000):
                      chunk = detail[offset:offset + 3000]
                      chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={path.name} part {offset // 3000 + 1}::{chunk}")

      - name: Retain complete quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-quality
          path: build/quality
          if-no-files-found: warn

  portable:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.10"
          - "3.12"
          - "3.14"

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Check local profiles and portable release paths
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-output
          python -B -S -m unittest \
            tests.test_distribution \
            tests.test_package_system.PackageLocationTests \
            tests.test_live_core.ReleaseTests.test_candidate_inventory_uses_portable_paths_on_windows \
            -v 2>&1 | tee ci-output/profile-paths.log

      - name: Verify provider configuration, HTTP capture and curl replay
        shell: bash
        run: |
          set -o pipefail
          python -B -S -m unittest \
            tests.test_provider_settings \
            tests.test_supervisor_startup \
            tests.test_http_debug \
            tests.test_http_debug_integration \
            tests.test_http_debug_options \
            tests.test_http_replay \
            -v 2>&1 | tee ci-output/http-debug-tests.log

      - name: Verify filesystem publication and process coordination
        shell: bash
        run: |
          set -o pipefail
          python -B -S -m unittest \
            tests.test_filesystem \
            tests.test_package_system.PackageTransactionTests \
            tests.test_package_sources \
            tests.test_catalog_publication \
            tests.test_evidence_log \
            tests.test_session_journal \
            tests.test_workspace_trust \
            tests.test_workspace_transactions \
            tests.test_plugins.PluginRetirementTests \
            tests.test_hot_plugins.SourceCaptureTests \
            tests.test_release \
            tests.test_build_portable.PortableBuildTests \
            tests.test_release_folder \
            tests.test_gepa_engine \
            tests.test_optimize_chat_prompt \
            tests.test_self_harness.ExperimentPublicationTests \
            tests.test_self_harness.CandidatePromotionTests \
            tests.test_self_harness.SelfHarnessTests \
            tests.test_workflow_stress.WorkflowCleanupTests \
            tests.test_package_recovery \
            tests.test_plugin_filesystem_process \
            tests.test_plugin_memory \
            -v 2>&1 | tee ci-output/filesystem.log

      - name: Verify supervisor recovery persistence
        shell: bash
        run: |
          set -o pipefail
          python -B -S -m unittest \
            tests.test_supervisor_persistence \
            tests.test_bootstrap_filesystem \
            tests.test_live_recovery_qa \
            -v 2>&1 | tee ci-output/supervisor-recovery.log

      - name: Build and verify the exact release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-output
          python -B -S -m tools.build_portable \
            --output ci-output/raychat.zip \
            --folder ci-output/raychat \
            --smoke \
            --smoke-output ci-output/acceptance 2>&1 | tee ci-output/build.log
        # POSIX: actual TUI navigation/cancellation/plugin lifecycle, feature
        # documented external plugins, startup/upgrade recovery, hostile paste/Unicode, independent
        # child queues, 50-child workflow/context stress, and offline optimization.
        # Windows: archive/package integrity and compilation only. No TUI claim.

      - name: Independently rebuild and compare every release byte
        shell: bash
        run: |
          set -o pipefail
          python -B -S -m tools.build_portable \
            --output ci-output/raychat.zip \
            --folder ci-output/raychat \
            --check --no-smoke 2>&1 | tee ci-output/rebuild.log

      - name: Publish release failure diagnostics
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for path in Path("ci-output").glob("*.log"):
              detail = path.read_text(encoding="utf-8", errors="replace")[-16000:]
              for offset in range(0, len(detail), 3000):
                  chunk = detail[offset:offset + 3000]
                  chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title={path.name} part {offset // 3000 + 1}::{chunk}")

      - name: Retain acceptance reports and terminal transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            ci-output/acceptance
            ci-output/*.log
          if-no-files-found: warn
