name: Publish tested release

on:
  workflow_run:
    workflows: ['Release CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-push Release CI run to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate source workflow before retrieving artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          python - <<'PY'
          import json, os
          r = json.load(open('run.json'))
          assert r['conclusion'] == 'success' and r['event'] == 'push'
          assert r['head_branch'] == 'main' and r['path'] == '.github/workflows/portable.yml'
          assert r['repository']['full_name'] == os.environ['GH_REPO']
          assert r['head_repository']['full_name'] == os.environ['GH_REPO']
          jobs = json.load(open('jobs.json'))['jobs']
          expected = {'Release / Linux', 'Release / macOS', 'Release / Windows + Defender'}
          assert {j['name'] for j in jobs} == expected
          assert all(j['conclusion'] == 'success' and j['head_sha'] == r['head_sha'] for j in jobs)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('sha=' + r['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: downloaded-artifacts
      - name: Verify all three archives and publish without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python -B -m tools.publish_user_release
          --artifacts downloaded-artifacts --commit ${{ steps.source.outputs.sha }}
