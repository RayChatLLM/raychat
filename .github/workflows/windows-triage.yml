# Temporary controlled diagnosis; these jobs cannot certify release publication.
name: Windows stress diagnostic

on:
  workflow_dispatch:
  push:
    branches: [release-build]
    paths: [.github/workflows/windows-triage.yml]

permissions:
  contents: read

concurrency:
  group: windows-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows lifetime diagnostic / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: idle
            os: windows-latest
            mode: background
            idle: '1'
            finish: finish-diagnostic
          - variant: full
            os: windows-latest
            mode: background
            idle: '0'
            finish: finish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RAYCHAT_WINDOWS_IDLE_DIAGNOSTIC: ${{ matrix.idle }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows-test.txt
      - name: Install CI-only console driver
        run: python -m pip install -r requirements-windows-test.txt
      - name: Capture runner identity before security changes
        run: |
          $Python = (Get-Command python).Source
          ./tools/verify_windows_filesystem.ps1 -Python $Python -InspectHost
      - name: Retain runner provenance before Defender activation
        uses: actions/upload-artifact@v4
        with:
          name: windows-triage-${{ matrix.variant }}-provenance
          path: ci-output/windows-standard-user/
          if-no-files-found: error
      - name: Start supervised background acceptance
        if: matrix.mode == 'background'
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor start
      - name: Wait for diagnostic checkpoint 1
        if: matrix.mode == 'background'
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 1
        if: matrix.mode == 'background' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-triage-${{ matrix.variant }}-1-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 2
        if: matrix.mode == 'background'
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 2
