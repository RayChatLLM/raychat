# Temporary read-only hosted-runner provenance; never a release publication check.
name: Windows stress diagnostic

on:
  workflow_dispatch:
  push:
    branches: [release-build]
    paths: [.github/workflows/windows-triage.yml]

permissions:
  contents: read

concurrency:
  group: windows-provenance-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows runner provenance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture runner identity without security changes
        run: |
          $Python = (Get-Command python).Source
          ./tools/verify_windows_filesystem.ps1 -Python $Python -InspectHost
      - name: Retain native runner provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-provenance-${{ matrix.os }}
          path: ci-output/windows-standard-user/
          if-no-files-found: error
