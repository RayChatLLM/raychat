name: Windows stress diagnostic

on:
  workflow_dispatch:
  push:
    branches: [release-build]
    paths: ['.github/workflows/windows-triage.yml']

permissions:
  contents: read

concurrency:
  group: windows-stress-diagnostic
  cancel-in-progress: true

jobs:
  stress:
    name: Windows stress diagnostic (not release acceptance)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start only the fifty-worker diagnostic under Defender
        run: python -B -S -m tools.windows_ci_supervisor start --stress-diagnostic
      - name: Wait for diagnostic checkpoint 1
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-1-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 2
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-2-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 3
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-3-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 4
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-4-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 5
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-5-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 6
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-6-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 7
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-7-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 8
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-8-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
      - name: Require the diagnostic selection and Defender evidence
        timeout-minutes: 17
        run: python -B -S -m tools.windows_ci_supervisor diagnostic-finish
      - name: Retain final diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-final-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
