# Temporary full-suite diagnosis; this job is never a release publication check.
name: Windows stress diagnostic

on:
  workflow_dispatch:
  push:
    branches: [release-build]
    paths: [.github/workflows/windows-triage.yml]

permissions:
  contents: read

concurrency:
  group: windows-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows full-suite diagnostic
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows-test.txt
      - name: Install CI-only console driver
        run: python -m pip install -r requirements-windows-test.txt
      - name: Start the unchanged full Windows acceptance harness
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor start
      - name: Wait for diagnostic checkpoint 1
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-triage-1-${{ github.run_attempt }}
          path: |
            ci-output/windows-standard-user/
            ci-output/windows-supervisor.*
          if-no-files-found: error
      - name: Wait for diagnostic checkpoint 2
        timeout-minutes: 2
        run: python -B -S -m tools.windows_ci_supervisor checkpoint --seconds 30
      - name: Retain diagnostic checkpoint 2
