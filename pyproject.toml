[tool.ruff]
target-version = "py310"
required-version = "==0.16.7"
preview = true

[tool.ruff.format]
preview = true

[tool.ruff.lint]
select = ["ALL"]
# The user requested removal of per-file copyright comments.
ignore = ["missing-copyright-notice"]

[tool.ruff.lint.per-file-ignores]
# The transcript state façade exposes one method per user-visible concern;
# the reasoning-visibility toggle pushed it one past the default budget.
"raychat/ui/state.py" = ["too-many-public-methods"]
# One test method per behavior; the suite grows with every UI behavior.
"tests/test_tui_state.py" = ["too-many-public-methods"]
# Spill tests must reset the module's cached store between environments.
"tests/test_text_store.py" = ["private-member-access"]
# Size-parity specs reach the policy's private compaction search and the
# session's private stored-history records to prove exact equality.
"tests/test_plugin_context.py" = ["private-member-access"]
# Deferred runtime-only imports: asyncio (and the ssl it pulls in) costs ~10 MiB
# RSS, so these modules import it only when an operation actually runs.
"raychat/filesystem.py" = ["import-outside-top-level"]
"raychat/transport.py" = ["import-outside-top-level"]
"raychat/ui/clipboard.py" = ["import-outside-top-level"]
# Only catalog/package downloads need urllib.request and the HTTP debug stack.
"raychat/plugin_manager.py" = ["import-outside-top-level"]
# The provider HTTP stack (urllib, ssl, http.client, email parsing, the debug
# opener) loads with the first real provider request instead of at import time;
# the package serves the deferred NoRedirects export through module __getattr__.
"plugins/chat_completions/client.py" = ["import-outside-top-level"]
"plugins/chat_completions/__init__.py" = ["undefined-export"]
# Seeded optimization sampling must reproduce the existing search sequence.
"plugins/optimization/gepa/batch_sampler.py" = ["suspicious-non-cryptographic-random-usage"]
"plugins/optimization/gepa/candidate_selector.py" = ["suspicious-non-cryptographic-random-usage"]
"plugins/optimization/gepa/merge.py" = ["suspicious-non-cryptographic-random-usage"]
"plugins/optimization/gepa/optimize_anything.py" = ["suspicious-non-cryptographic-random-usage"]
# This hosted-CI supervisor uses fixed, trusted argument vectors without a shell;
# explicit Popen handle isolation keeps Actions output pipes out of descendants.
"tools/windows_ci_supervisor.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false

[tool.mypy]
python_version = "3.10"
strict = true
disallow_any_expr = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_unreachable = true
warn_incomplete_stub = true
warn_unused_configs = true
strict_equality_for_none = true
explicit_package_bases = true
follow_imports = "normal"
incremental = false
enable_error_code = [
  "ignore-without-code", "truthy-bool", "truthy-iterable", "unused-awaitable",
  "possibly-undefined", "redundant-expr", "explicit-override", "mutable-override",
  "deprecated", "redundant-self", "unimported-reveal", "exhaustive-match",
  "unused-ignore",
]
files = ["."]
exclude_gitignore = true
exclude = ['^(\./)?raychat\.py$']
# tools/check_types.py separately checks identical launcher bytes because its
# module name collides with the raychat package in a single mypy invocation.
# tools/verify_quality.py independently inventories every non-generated source.
